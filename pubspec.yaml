name: indirimci
description: "AI destekli indirim ve kupon bulucu uygulama"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # HTTP
  dio: ^5.7.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: 10.1.4
  flutter_local_notifications: ^18.0.1
  
  # Icons
  iconsax: ^0.0.8
  workmanager: ^0.9.0+3
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
